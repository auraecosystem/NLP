      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: ''
      tags:
        - Site
  /v2/sites/{siteId}:
    get:
      operationId: SiteController_getOneV2_v2
      summary: Get Site
      description: Returns a site by its ID.
      parameters:
        - name: siteId
          in: path
          description: The site ID for the site you are requesting.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadSiteV2ResponseBodyDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      tags:
        - Site
    patch:
      operationId: SiteController_updateOneV2_v2
      summary: Update Site
      description: Updates an existing site.
      parameters:
        - name: siteId
          in: path
          description: The site ID for the site you are updating.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteV2RequestBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSiteV2ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      tags:
        - Site
    delete:
      operationId: SiteController_deleteV2_v2
      summary: Delete Site
      description: Deletes a site.
      parameters:
        - name: siteId
          in: path
          description: The site ID for the site you are deleting.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Site successfully deleted.
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      tags:
        - Site
  /v1/sites/{siteId}/duplicate:
    post:
      operationId: SiteController_duplicate_v1
      parameters:
        - name: siteId
          in: path
          description: The ID of the site to duplicate
          required: true
          schema:
            type: string
            format: uuid
            example: 123e4567-e89b-12d3-a456-426614174000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateSiteV1RequestBodyDto'
      responses:
        '201':
          description: The newly created duplicated site with all content and configuration copied from the original
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateSiteV1ResponseBodyDto'
      tags:
        - Site
  /v2/sites/{siteId}/duplicate:
    post:
      operationId: SiteController_duplicateV2_v2
      summary: Duplicate Site
      description: Duplicates an existing site with all its content and configuration.
      parameters:
        - name: siteId
          in: path
          description: The site ID for the site you are duplicating.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateSiteV2RequestBodyDto'
      responses:
        '201':
          description: Returns the newly created duplicated site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateSiteV2ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      tags:
        - Site
  /v1/sites/{siteId}/publish:
    post:
      operationId: SiteController_publishSite_v1
      summary: Publish Site
      description: Publishes a site with optional page filtering and content resource inclusion.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishSiteV1RequestBodyDto'
      responses:
        '204':
          description: Site published successfully
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      tags:
        - Site
  /v0/pages/batch:
    post:
      operationId: BatchPageController_batchCreateV0_v0
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreatePagesV0RequestBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchCreatePagesV0ResponseBodyDto'
        '400':
          description: Validation error or pages array invalid.
        '403':
          description: Access forbidden.
      tags:
        - Page
    patch:
      operationId: BatchPageController_batchUpdateV0_v0
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdatePagesV0RequestBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUpdatePagesV0ResponseBodyDto'
        '400':
