      tags:
        - Page
  /v0/pages/batch/lookup:
    post:
      operationId: BatchPageController_batchLookupV0_v0
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchLookupPagesV0RequestBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchLookupPagesV0Response'
        '403':
          description: Access forbidden.
      tags:
        - Page
  /v0/sites/{siteId}/collections:
    post:
      operationId: CollectionController_create_v0
      summary: Create Collection
      description: Create a collection for a site.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCollectionBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCollectionResponseDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      tags:
        - Collection
    get:
      operationId: CollectionController_list_v0
      summary: List Collections
      description: List collections for a site.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: pageTypeIdOrSlug
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCollectionsResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      tags:
        - Collection
  /v0/sites/{siteId}/collections/{collectionId}:
    patch:
      operationId: CollectionController_update_v0
      summary: Update Collection
      description: Rename or move a collection.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCollectionBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateCollectionResponseDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      tags:
        - Collection
    delete:
      operationId: CollectionController_delete_v0
      summary: Delete Collection
      description: Soft-delete a collection and all its descendant pages.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: ''
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      tags:
        - Collection
    get:
      operationId: CollectionController_get_v0
      summary: Get Collection
      description: Get a collection by ID.
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: collectionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetCollectionResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      tags:
        - Collection
  /v1/sites/{siteId}/pages:
    post:
      operationId: PageController_create_v1
      parameters:
        - name: siteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageV1RequestBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePageV1ResponseBodyDto'
      tags:
        - Page
  /v6/pages:
    post:
      operationId: PageController_createV6_v6
      summary: Create Page
      description: Creates a new page in a site.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageV6RequestBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePageV6ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      tags:
        - Page
    get:
      operationId: PageController_listV6_v6
      summary: List Pages
      description: Returns a list of pages for a site.
      parameters:
        - name: siteId
          in: query
          description: The site ID to list pages from.
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: The maximum number of pages to return.
          required: false
          schema:
            type: number
            default: 20
            maximum: 100
            minimum: 1
        - name: startingAfter
          in: query
          description: The pagination cursor. This is used to indicate what ID to list from.
          required: false
          schema:
            type: string
            format: uuid
        - name: pathPrefix
          in: query
          description: The filter that limits pages to only those with a pathname that begins with this value.
          required: false
          schema:
            type: string
            default: /
        - name: sortBy
          in: query
          description: The field to sort pages by.
          required: false
          schema:
            type: string
            default: path
            enum:
              - title
              - path
              - description
              - updatedAt
              - createdAt
        - name: sortDirection
          in: query
          description: The sort direction.
          required: false
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
        - name: includeOffline
          in: query
          description: The flag that determines whether to include offline pages in the results.
          required: false
          schema:
            type: string
            default: 'false'
            enum:
              - 'true'
              - 'false'
        - name: locale
          in: query
          description: The locale code to filter pages by.
          required: false
          schema:
            type: string
        - name: versionRef
          in: query
          description: |-
            The version reference to retrieve pages from. Defaults to `ref:draft` if not provided.

            Supported formats:
            - `ref:draft` - Draft/working version
            - `ref:live` - Live/published version
          required: false
          schema:
            type: string
            default: ref:draft
            enum:
              - ref:live
              - ref:draft
        - name: include
          in: query
          description: |-
            Include additional data in the response. Omit for the page record alone.

            Supported values:
            - `elements` - include each page's element tree. This feature is in beta and may change. Requests return `403` until the feature flag is enabled for your site or workspace.
          required: false
          schema:
            type: string
            enum:
              - elements
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPagesV2ResponseBodyDto'
        '403':
          description: Access forbidden.
      security:
        - Authentication: []
        - SiteApiKey: []
      tags:
        - Page
  /v6/pages/$bulk:
    post:
      operationId: PageController_createPagesBulkV6_v6
      summary: Create Pages
      description: |-
        This feature is in beta and may change. Requests return `403` until the feature flag is enabled for your site or workspace.

        Creates up to 1000 pages, each like Create Page. The response has one result per page, in request order: the created page, or the error that kept it from being created. An error in one page does not keep the others from being created. Only an error in the request itself, such as an invalid body, rejects the whole batch.

        The pages are created in one transaction.

        The request body is limited to 500 KB, and a larger one is rejected with `413`, so a request with element trees may hold fewer pages than that.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePagesBulkV6RequestBodyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePagesBulkV6ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
