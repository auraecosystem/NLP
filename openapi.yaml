openapi: 3.1.0
info:
  title: Makeswift API
  description: Documentation for the Makeswift public REST API.
  version: '1.0'
servers:
  - url: https://api.makeswift.com
    description: Production server
paths:
  /v1/auth/user-info:
    get:
      operationId: AuthController_getUserInfo_v1
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUserInfoV1ResponseBodyDto'
      tags:
        - Authentication
  /v1/workspaces/{workspaceId}/members/{userId}:
    post:
      operationId: WorkspaceMemberController_create_v1
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          description: The ID of the user
          required: true
          schema:
            type: string
            format: uuid
            example: d2ccb4e7-1364-496d-a131-bd996269ab2c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceMemberV1RequestBodyDto'
      responses:
        '204':
          description: ''
      tags:
        - Workspace Member
    delete:
      operationId: WorkspaceMemberController_delete_v1
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          description: The ID of the user
          required: true
          schema:
            type: string
            format: uuid
            example: d2ccb4e7-1364-496d-a131-bd996269ab2c
      responses:
        '204':
          description: ''
      tags:
        - Workspace Member
    patch:
      operationId: WorkspaceMemberController_update_v1
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          description: The ID of the user
          required: true
          schema:
            type: string
            format: uuid
            example: d2ccb4e7-1364-496d-a131-bd996269ab2c
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceMemberV1RequestBodyDto'
      responses:
        '204':
          description: ''
      tags:
        - Workspace Member
    get:
      operationId: WorkspaceMemberController_getUserRole_v1
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          description: The ID of the user
          required: true
          schema:
            type: string
            format: uuid
            example: d2ccb4e7-1364-496d-a131-bd996269ab2c
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkspaceMemberV1ResponseBodyDto'
      tags:
        - Workspace Member
  /v1/workspaces/{workspaceId}/members:
    get:
      operationId: WorkspaceMemberController_getMembers_v1
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 20
            maximum: 100
            minimum: 0
        - name: after
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorkspaceMemberV1ResponseBodyDto'
      tags:
        - Workspace Member
  /v1/workspaces/{workspaceId}/sites:
    post:
      operationId: SiteController_create_v1
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteV1RequestBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSiteV1ResponseBodyDto'
      tags:
        - Site
    get:
      operationId: SiteController_list_v1
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 20
            maximum: 100
            minimum: 0
        - name: after
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSiteV1ResponseBodyDto'
      tags:
        - Site
  /v2/sites:
    post:
      operationId: SiteController_createV2_v2
      summary: Create Site
      description: Creates a new site in a workspace.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteV2RequestBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSiteV2ResponseBodyDto'
        '400':
          description: ''
