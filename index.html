<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AEGIS AI - Advanced Tablet Interface</title>
    <!-- Three.js for 3D Avengers Lab Holograms -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #010204; color: #00f0ff; }
        
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Sci-Fi HUD Overlay */
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px; }
        .interactive { pointer-events: auto; }

        header { display: flex; justify-content: space-between; align-items: center; background: rgba(2, 5, 12, 0.75); border: 1px solid rgba(0, 240, 255, 0.3); padding: 10px 20px; border-radius: 8px; backdrop-filter: blur(10px); }
        .logo { font-size: 1.2rem; font-weight: 800; letter-spacing: 2px; color: #ff3333; text-shadow: 0 0 10px rgba(255,51,51,0.6); display: flex; align-items: center; gap: 10px; }
        .status-pill { font-size: 0.75rem; background: rgba(0,240,255,0.1); border: 1px solid #00f0ff; padding: 3px 10px; border-radius: 20px; text-transform: uppercase; animation: pulse 2s infinite; }

        /* Assistant Switcher Bar */
        .assistant-bar { display: flex; gap: 8px; overflow-x: auto; padding: 5px 0; max-width: 100%; scrollbar-width: none; }
        .assistant-btn { background: rgba(0,20,40,0.8); border: 1px solid rgba(0,240,255,0.3); color: #fff; padding: 6px 14px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; transition: all 0.3s; white-space: nowrap; }
        .assistant-btn.active { background: rgba(0,240,255,0.25); border-color: #00f0ff; box-shadow: 0 0 12px rgba(0,240,255,0.5); font-weight: bold; }

        /* Central Interaction & Dialogue Box */
        .center-hud { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; text-align: center; }
        .dialogue-box { background: rgba(2, 5, 12, 0.85); border: 1px solid rgba(0,240,255,0.4); max-width: 600px; width: 90%; padding: 18px; border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 0 30px rgba(0,0,0,0.8); margin-bottom: 20px; }
        .dialogue-speaker { font-size: 0.8rem; letter-spacing: 1.5px; margin-bottom: 5px; color: #ffcc00; text-transform: uppercase; }
        .dialogue-text { font-size: 1.05rem; line-height: 1.4; color: #e0f7ff; min-height: 45px; }

        /* Quick Action Chips & Mood Widget */
        .control-panel { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 700px; margin: 0 auto; }
        .chips-container { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .chip { background: rgba(0,40,70,0.7); border: 1px solid rgba(0,240,255,0.4); color: #00f0ff; padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; cursor: pointer; white-space: nowrap; }
        .chip:hover { background: rgba(0,240,255,0.3); color: #fff; }

        /* Mood Selector */
        .mood-bar { display: flex; justify-content: center; gap: 10px; background: rgba(2,5,12,0.8); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .mood-btn { background: none; border: 1px solid rgba(0,240,255,0.3); color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; }
        .mood-btn:hover, .mood-btn.active { background: #00f0ff; color: #000; font-weight: bold; }

        /* Bottom Command Input */
        .input-bar { display: flex; gap: 10px; background: rgba(2, 5, 12, 0.9); padding: 10px; border-radius: 8px; border: 1px solid rgba(0,240,255,0.3); backdrop-filter: blur(10px); }
        .input-bar input { flex: 1; background: rgba(0,0,0,0.5); border: 1px solid rgba(0,240,255,0.3); border-radius: 4px; padding: 10px 15px; color: #fff; font-size: 0.95rem; outline: none; }
        .input-bar input:focus { border-color: #00f0ff; box-shadow: 0 0 8px rgba(0,240,255,0.4); }
        .action-btn { background: linear-gradient(135deg, #0077ff, #00f0ff); border: none; color: #000; font-weight: bold; padding: 10px 18px; border-radius: 4px; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .action-btn.mic-active { background: #ff3333; color: #fff; animation: pulse 1s infinite; }

        /* Settings Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-content { background: #050a14; border: 1px solid #00f0ff; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; }
        .modal-content input { background: #000; border: 1px solid rgba(0,240,255,0.4); padding: 10px; color: #fff; border-radius: 4px; }
        
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <!-- Header -->
        <header class="interactive">
            <div class="logo" id="hud-title">⚡ ULTRON AI <span style="font-size:0.6rem; color:#00f0ff;">[AVENGERS LAB v6.2]</span></div>
            <div style="display:flex; gap:10px; align-items:center;">
                <div class="status-pill" id="wake-status">Mic Ready</div>
                <button class="assistant-btn" onclick="toggleWakeLock()" id="wakelock-btn">Keep Screen On</button>
                <button class="assistant-btn" onclick="toggleClapListener()" id="clap-btn">🔊 Clap/Whistle Wake</button>
                <button class="assistant-btn" onclick="openSettings()">⚙️</button>
            </div>
        </header>

        <!-- Assistant Switcher -->
        <div class="assistant-bar interactive" id="assistant-list">
            <button class="assistant-btn active" onclick="switchAssistant('ultron')">Ultron</button>
            <button class="assistant-btn" onclick="switchAssistant('jarvis')">Jarvis</button>
            <button class="assistant-btn" onclick="switchAssistant('friday')">Friday</button>
            <button class="assistant-btn" onclick="switchAssistant('edith')">Edith</button>
            <button class="assistant-btn" onclick="switchAssistant('karen')">Karen</button>
            <button class="assistant-btn" onclick="switchAssistant('leo')">Leo</button>
        </div>

        <!-- Center Dialogue & Mood Reaction -->
        <div class="center-hud">
            <div class="dialogue-box interactive">
                <div class="dialogue-speaker" id="speaker-name">Ultron [Strategic Matrix]</div>
                <div class="dialogue-text" id="dialogue-output">System online. Awaiting your command, Sir. Say "Wakeup Ultron" or tap the mic.</div>
            </div>
        </div>

        <!-- Control Panel, Mood Selector & Input -->
        <div class="control-panel interactive">
            <div class="mood-bar">
                <span style="font-size:0.75rem; align-self:center; color:#00f0ff;">Current Mood:</span>
                <button class="mood-btn active" onclick="setMood('neutral', this)">Neutral</button>
                <button class="mood-btn" onclick="setMood('stressed', this)">Stressed 😰</button>
                <button class="mood-btn" onclick="setMood('energetic', this)">Energetic ⚡</button>
                <button class="mood-btn" onclick="setMood('tired', this)">Tired 🌙</button>
                <button class="mood-btn" onclick="setMood('curious', this)">Curious 🔍</button>
            </div>

            <div class="chips-container">
                <button class="chip" onclick="sendPrompt('Open YouTube')">▶ Open YouTube</button>
                <button class="chip" onclick="sendPrompt('Open Chrome')">🌐 Open Browser</button>
                <button class="chip" onclick="sendPrompt('Open WhatsApp')">💬 Open WhatsApp</button>
                <button class="chip" onclick="sendPrompt('Open Camera')">📷 Open Camera</button>
                <button class="chip" onclick="sendPrompt('Give me a strategic health and daily routine guide.')">🛡 Daily Routine Guide</button>
                <button class="chip" onclick="sendPrompt('Run system diagnostic and scan tablet features.')">🔍 System Scan</button>
            </div>

            <div class="input-bar">
                <input type="text" id="user-input" placeholder="Command Ultron, Jarvis, Friday, Edith, Karen, or Leo..." onkeypress="if(event.key==='Enter') processCommand()">
                <button class="action-btn" id="mic-btn" onclick="toggleVoiceInput()">Speak</button>
                <button class="action-btn" onclick="processCommand()">Send</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <h3>⚙️ Ultron System Settings</h3>
            <label style="font-size:0.8rem;">Gemini API Key (Google AI Studio):</label>
            <input type="password" id="api-key-input" placeholder="Paste your API key here...">
            <button class="action-btn" onclick="saveSettings()">Save Configuration</button>
            <button class="assistant-btn" onclick="closeSettings()">Close</button>
        </div>
    </div>

    <script>
        let currentAI = 'ultron';
        let currentMood = 'neutral';
        let apiKey = localStorage.getItem('ultron_gemini_key') || '';
        let wakeLock = null;
        let isListeningForClap = false;
        let audioCtx, analyser, micStream;

        const aiConfig = {
            ultron: { name: "Ultron", color: 0xff3300, secondary: 0xff8800, pitch: 0.7, rate: 0.95, intro: "Ultron online. Peace in our time." },
            jarvis: { name: "Jarvis", color: 0xffaa00, secondary: 0xffcc00, pitch: 1.0, rate: 1.05, intro: "Good day, Sir. Jarvis systems fully operational." },
            friday: { name: "Friday", color: 0x00f0ff, secondary: 0x0077ff, pitch: 1.3, rate: 1.1, intro: "Friday online. How can I assist your workflow today?" },
            edith: { name: "Edith", color: 0x00ff66, secondary: 0x00aa33, pitch: 1.2, rate: 1.0, intro: "EDITH protocol engaged. All tactical data secured." },
            karen: { name: "Karen", color: 0x00ffff, secondary: 0xff00ff, pitch: 1.4, rate: 1.05, intro: "Suit interface active. Ready for assistance, Peter." },
            leo: { name: "Leo", color: 0x9900ff, secondary: 0xcc33ff, pitch: 0.9, rate: 1.0, intro: "Leo online. Mind and body guidance system ready." }
        };

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 7;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        let coreGeometry = new THREE.IcosahedronGeometry(2, 2);
        let coreMaterial = new THREE.MeshBasicMaterial({ color: 0xff3300, wireframe: true, transparent: true, opacity: 0.6 });
        let hologramCore = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(hologramCore);

        const ringGeo = new THREE.TorusGeometry(3, 0.03, 16, 100);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xff8800, transparent: true, opacity: 0.4 });
        const orbitalRing = new THREE.Mesh(ringGeo, ringMat);
        scene.add(orbitalRing);

        const gridHelper = new THREE.GridHelper(30, 30, 0x00f0ff, 0x002244);
        gridHelper.position.y = -3.5;
        scene.add(gridHelper);

        const particleCount = 300;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i++) particlePos[i] = (Math.random() - 0.5) * 12;
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.04, transparent: true, opacity: 0.7 });
        const particleField = new THREE.Points(particleGeo, particleMat);
        scene.add(particleField);

        let isDragging = false, prevMousePos = { x: 0, y: 0 };
        window.addEventListener('pointerdown', e => { isDragging = true; prevMousePos = { x: e.clientX, y: e.clientY }; });
        window.addEventListener('pointermove', e => {
            if (!isDragging) return;
            let dx = e.clientX - prevMousePos.x;
            let dy = e.clientY - prevMousePos.y;
            hologramCore.rotation.y += dx * 0.005;
            hologramCore.rotation.x += dy * 0.005;
            prevMousePos = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('pointerup', () => isDragging = false);

        function animate() {
            requestAnimationFrame(animate);
            hologramCore.rotation.y += 0.008;
            hologramCore.rotation.z += 0.003;
            orbitalRing.rotation.x += 0.005;
            orbitalRing.rotation.y -= 0.008;
            particleField.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function switchAssistant(key) {
            currentAI = key;
            let cfg = aiConfig[key];
            document.querySelectorAll('.assistant-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            hologramCore.material.color.setHex(cfg.color);
            orbitalRing.material.color.setHex(cfg.secondary);
            particleMat.color.setHex(cfg.color);

            document.getElementById('speaker-name').innerText = `${cfg.name} [${currentMood.toUpperCase()} STATE]`;
            speak(cfg.intro, cfg.pitch, cfg.rate);
        }

        function setMood(mood, btn) {
            currentMood = mood;
            document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            let cfg = aiConfig[currentAI];
            document.getElementById('speaker-name').innerText = `${cfg.name} [${mood.toUpperCase()} STATE]`;
            speak(`Adjusted emotional matrix to ${mood}, Sir.`, cfg.pitch, cfg.rate);
        }

        function speak(text, pitch = 1.0, rate = 1.0) {
            document.getElementById('dialogue-output').innerText = text;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.pitch = pitch;
                utterance.rate = rate;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function processCommand() {
            let input = document.getElementById('user-input').value.trim();
            if (!input) return;
            document.getElementById('user-input').value = '';
            document.getElementById('dialogue-output').innerText = `[Processing query via ${aiConfig[currentAI].name}...]`;

            let lower = input.toLowerCase();
            if (lower.includes('switch to jarvis') || lower.includes('activate jarvis')) { switchAssistant('jarvis'); return; }
            if (lower.includes('switch to friday') || lower.includes('call friday')) { switchAssistant('friday'); return; }
            if (lower.includes('switch to edith') || lower.includes('open edith')) { switchAssistant('edith'); return; }
            if (lower.includes('switch to karen') || lower.includes('activate karen')) { switchAssistant('karen'); return; }
            if (lower.includes('switch to leo') || lower.includes('talk to leo')) { switchAssistant('leo'); return; }
            if (lower.includes('wakeup ultron') || lower.includes('switch to ultron')) { switchAssistant('ultron'); return; }

            if (lower.includes('open youtube')) { launchApp('https://www.youtube.com', 'vnd.youtube://'); return; }
            if (lower.includes('open chrome') || lower.includes('open browser')) { launchApp('https://www.google.com', ''); return; }
            if (lower.includes('open whatsapp')) { launchApp('https://wa.me', 'whatsapp://'); return; }
            if (lower.includes('open camera')) { launchApp('', 'intent://#Intent;action=android.media.action.IMAGE_CAPTURE;end;'); return; }
            if (lower.includes('open maps')) { launchApp('https://maps.google.com', 'geo:0,0?q='); return; }
            if (lower.includes('open settings')) { launchApp('', 'intent://#Intent;action=android.settings.SETTINGS;end;'); return; }

            if (apiKey) {
                try {
                    let response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: `You are ${aiConfig[currentAI].name}, a sci-fi AI assistant with ${currentMood} emotions. Answer concisely and wisely: ${input}` }] }] })
                    });
                    let data = await response.json();
                    let reply = data.candidates[0].content.parts[0].text;
                    speak(reply, aiConfig[currentAI].pitch, aiConfig[currentAI].rate);
                } catch(e) {
                    speak("Network connection error with Gemini neural link, Sir.", 1.0, 1.0);
                }
            } else {
                let replies = {
                    ultron: `Analyzing tactical parameters regarding "${input}". Peace requires absolute security, Sir.`,
                    jarvis: `I have evaluated your request regarding "${input}". All protocols are functioning smoothly.`,
                    friday: `Running diagnostics on "${input}". Vitality and systems check complete!`,
                    edith: `EDITH tactical analysis for "${input}": Focus locked and optimized.`,
                    karen: `Peter, looking over "${input}", everything in your suit matrix is green.`,
                    leo: `Reflecting on "${input}", take a steady breath. Life wisdom and balance guide our path forward.`
                };
                speak(replies[currentAI], aiConfig[currentAI].pitch, aiConfig[currentAI].rate);
            }
        }

        function launchApp(webUrl, intentUri) {
            speak(`Launching requested application, Sir.`, aiConfig[currentAI].pitch, aiConfig[currentAI].rate);
            try {
                if (intentUri.startsWith('intent://')) {
                    window.location.href = intentUri;
                } else {
                    let iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = intentUri;
                    document.body.appendChild(iframe);
                    setTimeout(() => { window.location.href = webUrl; }, 500);
                }
            } catch(e) {
                window.open(webUrl, '_blank');
            }
        }

        function toggleVoiceInput() {
            if (!('webkitSpeechRecognition' in
